name: Deploy React App to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Debug Build Folder
        run: ls -la dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1  # 👈 Stockholm region

      - name: Upload to S3
        run: aws s3 sync dist/ s3://www.genesiaproperties.com --delete

      - name: Keep the entry page fresh
        run: >-
          aws s3 cp dist/index.html s3://www.genesiaproperties.com/index.html
          --content-type text/html
          --cache-control 'no-cache, no-store, must-revalidate'

      - name: Refresh CloudFront homepage
        shell: bash
        run: |
          distribution_id=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'www.genesiaproperties.com')].Id | [0]" --output text)
          if [ -z "$distribution_id" ] || [ "$distribution_id" = "None" ]; then
            echo 'No CloudFront distribution found for www.genesiaproperties.com.' >&2
            exit 1
          fi
          invalidation_id=$(aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/' '/index.html' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$distribution_id" --id "$invalidation_id"
